<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, Helvetica, Arial, sans-serif">
<rect width="1200" height="560" fill="#FFFFFF"/>
<text x="600" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#0B3C49">Same mass, different structures</text>
<text x="600" y="100" text-anchor="middle" font-size="24" fill="#3F5A63">Each glycan holds one Fuc, one Gal and one GlcNAc</text>

<line x1="400" y1="140" x2="400" y2="455" stroke="#C9D8DC" stroke-width="2"/>
<line x1="800" y1="140" x2="800" y2="455" stroke="#C9D8DC" stroke-width="2"/>

<!-- Panel 1: Lewis a -->
<g transform="translate(0,0)">
<g stroke="#222" stroke-width="3" fill="none">
<line x1="290" y1="300" x2="190" y2="215"/>
<line x1="290" y1="300" x2="170" y2="300" stroke-dasharray="9 7"/>
</g>
<rect x="268" y="278" width="44" height="44" fill="#0072BC" stroke="#000" stroke-width="3"/>
<circle cx="190" cy="215" r="24" fill="#FFD400" stroke="#000" stroke-width="3"/>
<polygon points="170,272 196,318 144,318" fill="#ED1C24" stroke="#000" stroke-width="3" transform="translate(0,0)"/>
<text x="250" y="238" text-anchor="start" font-size="22" font-weight="600" fill="#1B2A30">β1,3</text>
<text x="230" y="290" text-anchor="middle" font-size="22" font-weight="600" fill="#1B2A30">α1,4</text>
<text x="200" y="405" text-anchor="middle" font-size="30" font-weight="700" fill="#0B5D6B">Lewis a</text>
<text x="200" y="439" text-anchor="middle" font-size="21" fill="#3F5A63">Gal on position 3, Fuc on 4</text>
</g>

<!-- Panel 2: Lewis x -->
<g transform="translate(400,0)">
<g stroke="#222" stroke-width="3" fill="none">
<line x1="290" y1="300" x2="170" y2="300"/>
<line x1="290" y1="300" x2="190" y2="215" stroke-dasharray="9 7"/>
</g>
<rect x="268" y="278" width="44" height="44" fill="#0072BC" stroke="#000" stroke-width="3"/>
<circle cx="170" cy="300" r="24" fill="#FFD400" stroke="#000" stroke-width="3"/>
<polygon points="190,190 216,236 164,236" fill="#ED1C24" stroke="#000" stroke-width="3"/>
<text x="250" y="238" text-anchor="start" font-size="22" font-weight="600" fill="#1B2A30">α1,3</text>
<text x="230" y="290" text-anchor="middle" font-size="22" font-weight="600" fill="#1B2A30">β1,4</text>
<text x="200" y="405" text-anchor="middle" font-size="30" font-weight="700" fill="#0B5D6B">Lewis x</text>
<text x="200" y="439" text-anchor="middle" font-size="21" fill="#3F5A63">Gal on position 4, Fuc on 3</text>
</g>

<!-- Panel 3: H type 2 linear -->
<g transform="translate(800,0)">
<g stroke="#222" stroke-width="3" fill="none">
<line x1="290" y1="300" x2="170" y2="300"/>
<line x1="170" y1="300" x2="170" y2="205" stroke-dasharray="9 7"/>
</g>
<rect x="268" y="278" width="44" height="44" fill="#0072BC" stroke="#000" stroke-width="3"/>
<circle cx="170" cy="300" r="24" fill="#FFD400" stroke="#000" stroke-width="3"/>
<polygon points="170,150 196,196 144,196" fill="#ED1C24" stroke="#000" stroke-width="3"/>
<text x="188" y="262" text-anchor="start" font-size="22" font-weight="600" fill="#1B2A30">α1,2</text>
<text x="230" y="290" text-anchor="middle" font-size="22" font-weight="600" fill="#1B2A30">β1,4</text>
<text x="200" y="405" text-anchor="middle" font-size="30" font-weight="700" fill="#0B5D6B">H type 2</text>
<text x="200" y="439" text-anchor="middle" font-size="21" fill="#3F5A63">Linear chain, Fuc on Gal</text>
</g>

<!-- Legend -->
<g transform="translate(0,505)" font-size="21" fill="#1B2A30">
<circle cx="250" cy="14" r="14" fill="#FFD400" stroke="#000" stroke-width="2"/>
<text x="274" y="22">Gal</text>
<rect x="340" y="0" width="28" height="28" fill="#0072BC" stroke="#000" stroke-width="2"/>
<text x="378" y="22">GlcNAc</text>
<polygon points="500,0 514,28 486,28" fill="#ED1C24" stroke="#000" stroke-width="2"/>
<text x="528" y="22">Fuc</text>
<line x1="610" y1="14" x2="660" y2="14" stroke="#222" stroke-width="3"/>
<text x="672" y="22">β bond</text>
<line x1="790" y1="14" x2="840" y2="14" stroke="#222" stroke-width="3" stroke-dasharray="9 7"/>
<text x="852" y="22">α bond</text>
</g>
</svg>
